name: Video continuation (reviewed stage push)
on:
  push:
    branches: ['video/cloud-render']
    paths:
      - 'video/render-test/**'
      - '.github/workflows/video-render.yml'
permissions:
  contents: read
concurrency:
  group: video-render-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
    working-directory: video/render-test
jobs:
  continuation:
    if: github.repository == 'ANIRUDDH-001/OrderTruth' && github.ref == 'refs/heads/video/cloud-render' && github.event_name == 'push' && github.event.deleted == false && github.run_attempt == 1
    environment: ordertruth-video
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
      HYPERFRAMES_SKIP_SKILLS: '1'
    steps:
      - name: Preserve committed bytes before checkout
        working-directory: ${{ runner.temp }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Disposable runner only. Set this before checkout; never normalize hashed files afterward.
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw 'Could not disable checkout newline conversion' }
          git config --global core.eol lf
          if ($LASTEXITCODE -ne 0) { throw 'Could not pin checkout line endings' }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /video/render-test/
            /.github/workflows/video-render.yml
            /vercel.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.0'
      - name: Validate stage and video-only publication
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/cloud-stage-guard.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Stage guard failed' }
          "VIDEO_WORKSPACE=$PWD" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "VIDEO_FONT_PATH=$(Join-Path $env:WINDIR 'Fonts/arialbd.ttf')" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "PLAYWRIGHT_BROWSERS_PATH=$(Join-Path $env:RUNNER_TEMP 'ordertruth-playwright')" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "CAPTURE_OUTPUT=$(Join-Path $env:RUNNER_TEMP 'ordertruth-continuation')" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Browser-free policy and manifest checks
        if: env.CLOUD_STAGE != 'recording-smoke'
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force qc | Out-Null
          node scripts/verify-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Asset verification failed' }
          node scripts/verify-publication.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Publication inventory failed' }
          node scripts/test-cloud-stage-guard.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Stage tests failed' }
          node production/resume-existing-case.cjs --policy-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Capture policy failed' }
          node --test production/capture-diagnostics.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Capture diagnostics failed' }
          python production/test_assembly_manifest.py
          if ($LASTEXITCODE -ne 0) { throw 'Assembly policy failed' }
          python production/assemble-host.py final/cloud --manifest $env:ASSEMBLY_MANIFEST --validate-only
          if ($LASTEXITCODE -ne 0) { throw 'Scene manifest failed' }
      - name: Browser-free recording smoke checks
        if: env.CLOUD_STAGE == 'recording-smoke'
        run: |
          node scripts/verify-publication.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Publication inventory failed' }
          node scripts/test-cloud-stage-guard.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Stage guard failed' }
          node --test production/recording-smoke.test.cjs production/recording-lifecycle.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Smoke/lifecycle checks failed' }
      - name: Install locked dependencies without lifecycle scripts
        if: env.CLOUD_STAGE != 'validate'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
      - name: Install hash-verified tools and pinned Chromium
        if: env.CLOUD_STAGE != 'validate'
        run: ./scripts/install-windows-tools.ps1
      - name: Record local HTML lifecycle smoke test
        if: env.CLOUD_STAGE == 'recording-smoke'
        timeout-minutes: 4
        run: |
          node production/recording-smoke.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Recording smoke failed; no automatic retry' }
      - name: Capture exactly one authorized existing-case stage
        if: env.CLOUD_STAGE == 'plan' || env.CLOUD_STAGE == 'approve' || env.CLOUD_STAGE == 'execute'
        timeout-minutes: 8
        env:
          ORDERTRUTH_GUEST_SESSION_B64: ${{ secrets.ORDERTRUTH_GUEST_SESSION_B64 }}
        run: |
          node production/resume-existing-case.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Capture stopped. Reconcile before any new authorization; never retry blindly.' }
      - name: Assemble reviewed manifest sequentially
        if: env.CLOUD_STAGE == 'assemble-review' || env.CLOUD_STAGE == 'assemble-final'
        run: |
          python production/assemble-host.py final/cloud --manifest $env:ASSEMBLY_MANIFEST
          if ($LASTEXITCODE -ne 0) { throw 'Assembly or full decode verification failed' }
      - name: Upload sanitized continuation evidence only
        if: success() && (env.CLOUD_STAGE == 'plan' || env.CLOUD_STAGE == 'approve' || env.CLOUD_STAGE == 'execute')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordertruth-${{ env.CLOUD_STAGE }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ordertruth-continuation/public/capture.json
            ${{ runner.temp }}/ordertruth-continuation/public/fresh-plan.json
            ${{ runner.temp }}/ordertruth-continuation/public/continuation.mp4
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload verified assembly only
        if: success() && (env.CLOUD_STAGE == 'assemble-review' || env.CLOUD_STAGE == 'assemble-final')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordertruth-${{ env.CLOUD_STAGE }}-${{ github.run_id }}
          path: |
            video/render-test/final/cloud/OrderTruth-Final-Demo.mp4
            video/render-test/final/cloud/OrderTruth-Incomplete-Review.mp4
            video/render-test/final/cloud/OrderTruth-Final-Demo.srt
            video/render-test/final/cloud/OrderTruth-Incomplete-Review.srt
            video/render-test/final/cloud/OrderTruth-Final-Demo.qc.json
            video/render-test/final/cloud/OrderTruth-Incomplete-Review.qc.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload verified recording smoke only
        if: success() && env.CLOUD_STAGE == 'recording-smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordertruth-recording-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ordertruth-recording-smoke/public/recording-smoke.mp4
            ${{ runner.temp }}/ordertruth-recording-smoke/public/qc.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve sanitized smoke failure QC
        if: failure() && env.CLOUD_STAGE == 'recording-smoke'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordertruth-recording-smoke-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/ordertruth-recording-smoke/public/qc.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve fixed sanitized capture failure report
        if: failure() && (env.CLOUD_STAGE == 'plan' || env.CLOUD_STAGE == 'approve' || env.CLOUD_STAGE == 'execute')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordertruth-capture-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/ordertruth-continuation/public/failure-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Remove runner-private state and raw recording even on failure
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          # Fixed descendants only; no path is taken from session data or workflow inputs.
          $TempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar)
          foreach ($Leaf in @('ordertruth-session-private','ordertruth-continuation','ordertruth-recording-smoke')) {
            $Target = [IO.Path]::GetFullPath((Join-Path $TempRoot $Leaf))
            if (-not $Target.StartsWith($TempRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) { throw 'Cleanup containment failed' }
            if (Test-Path -LiteralPath $Target) { Remove-Item -LiteralPath $Target -Recurse -Force }
          }
