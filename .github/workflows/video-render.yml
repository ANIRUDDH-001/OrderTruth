name: Video render test
on:
  push:
    branches: ['video/cloud-render']
    paths:
      - 'video/render-test/**'
      - '.github/workflows/video-render.yml'
      - 'vercel.json'
permissions:
  contents: read
concurrency:
  group: video-render-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: pwsh
    working-directory: video/render-test
jobs:
  render:
    # One corrective push from the reviewed failed commit; run 2, first attempt only.
    if: github.repository == 'ANIRUDDH-001/OrderTruth' && github.ref == 'refs/heads/video/cloud-render' && github.event_name == 'push' && github.event.deleted == false && github.event.before == 'cf33ef9733df0f12f4bb43bcca575ecd8b60791d' && github.run_number == 2 && github.run_attempt == 1
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      HYPERFRAMES_NO_TELEMETRY: '1'
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
      HYPERFRAMES_SKIP_SKILLS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /video/render-test/
            /.github/workflows/video-render.yml
            /vercel.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.0'
      - name: Check public repository and deployment exclusions
        run: |
          $ErrorActionPreference = 'Stop'
          "PLAYWRIGHT_BROWSERS_PATH=$(Join-Path $env:RUNNER_TEMP 'ordertruth-playwright')" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          "STAGE1_OUTPUT=$(Join-Path $env:RUNNER_TEMP 'ordertruth-stage1')" | Out-File -LiteralPath $env:GITHUB_ENV -Append -Encoding utf8
          $Event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          if ($Event.repository.private -ne $false -or $Event.repository.full_name -ne 'ANIRUDDH-001/OrderTruth') { throw 'Public target repository required' }
          if ($Event.head_commit.message -notmatch '\[skip render\]') { throw 'Render auto-deploy skip marker missing' }
          $Rules = (Get-Content -Raw ../../vercel.json | ConvertFrom-Json).git.deploymentEnabled
          if ($Rules.'video/cloud-render' -ne $false) { throw 'Exact Vercel branch exclusion missing' }
          foreach ($Property in $Rules.PSObject.Properties) { if ($Property.Value -ne $false) { throw 'Potential overriding Vercel deployment rule' } }
      - name: Install locked dependencies without lifecycle scripts
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked dependency installation failed' }
      - name: Install hash-verified FFmpeg and pinned Chromium
        run: ./scripts/install-windows-tools.ps1
      - name: Verify assets and read-only route policy
        run: |
          New-Item -ItemType Directory -Path qc -ErrorAction Stop | Out-Null
          node scripts/verify-assets.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Asset integrity failed' }
          node production/capture-landing-playwright.cjs --policy-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Read-only policy failed' }
          node production/capture-product-host.cjs footage/policy-test --policy-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Existing protected-action safeguards failed' }
      - name: Record real landing page and verify five-second encode
        timeout-minutes: 8
        run: |
          node production/capture-landing-playwright.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Capture, browser cleanup or encoding verification failed' }
      - name: Preserve verified public footage and sanitized QC
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordertruth-stage1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ordertruth-stage1/public/landing.webm
            ${{ runner.temp }}/ordertruth-stage1/public/landing.mp4
            ${{ runner.temp }}/ordertruth-stage1/public/smoke-5s.mp4
            ${{ runner.temp }}/ordertruth-stage1/public/landing.png
            ${{ runner.temp }}/ordertruth-stage1/public/qc-public.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Preserve sanitized failure report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ordertruth-stage1-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/ordertruth-stage1/public/qc-public.json
          if-no-files-found: warn
          retention-days: 14
