<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OrderTruth Gate 0 Sandbox checkout</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
      .banner { border: 2px solid #b45309; padding: .5rem .75rem; border-radius: .5rem; }
      #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85rem; border: 1px solid #8886; padding: .75rem; border-radius: .5rem; min-height: 4rem; }
      [data-kind="error"] { color: #b91c1c; } [data-kind="ok"] { color: #15803d; }
      button { font: inherit; padding: .4rem .8rem; }
    </style>
  <link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"><link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-180.png"><link rel="apple-touch-icon" sizes="167x167" href="/icons/apple-touch-167.png"><link rel="apple-touch-icon" sizes="152x152" href="/icons/apple-touch-152.png"><link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#00695c"><link rel="manifest" href="/manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="OrderTruth"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="msapplication-TileColor" content="#00695c"><meta name="msapplication-config" content="/browserconfig.xml"></head>
  <body>
    <p class="banner"><strong>PayPal Sandbox only.</strong> Temporary Gate 0 test page. No real money. OrderTruth is independent and not affiliated with PayPal.</p>
    <h1>Gate 0 test item: USD 1.00</h1>
    <p>Price is set by the server. Approve with your <em>Sandbox personal (buyer)</em> account.</p>
    <paypal-button id="paypal-button" type="pay" hidden></paypal-button>
    <p id="status" role="status" aria-live="polite">Loading PayPal Sandbox SDK…</p>
    <div id="log" aria-label="Event log"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
