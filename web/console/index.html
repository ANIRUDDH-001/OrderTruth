<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>OrderTruth console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2' y='5' width='20' height='3.2' rx='1.6' fill='%2318266A'/%3E%3Crect x='2' y='15.8' width='20' height='3.2' rx='1.6' fill='%232B5BF5'/%3E%3Cpath d='M12 8.2v7.6' stroke='%232B5BF5' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-home" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 7 8 2.5 13.5 7v6.5h-4v-4h-3v4h-4z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 2 14.5 13.5h-13z"/><path d="M8 6.5v3M8 11.5v.01"/></symbol>
  <symbol id="i-list" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5.5 4h8M5.5 8h8M5.5 12h8M2.5 4h.01M2.5 8h.01M2.5 12h.01"/></symbol>
  <symbol id="i-shield" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M8 1.8 13 3.6v4c0 3.2-2.2 5.4-5 6.6-2.8-1.2-5-3.4-5-6.6v-4z"/><path d="m5.8 8 1.6 1.6L10.4 6.6"/></symbol>
  <symbol id="i-code" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5.5 4.5-3.5 3.5 3.5 3.5M10.5 4.5 14 8l-3.5 3.5"/></symbol>
  <symbol id="i-ops" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="2"/><path d="M5 7h6M5 10h3.5" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></symbol>
  <symbol id="i-check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></symbol>
  <symbol id="i-x" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m4.5 4.5 7 7M11.5 4.5l-7 7"/></symbol>
  <symbol id="i-lock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="7" rx="1.5"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/></symbol>
  <symbol id="i-copy" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="5" width="8.5" height="8.5" rx="1.5"/><path d="M11 5V3.5A1 1 0 0 0 10 2.5H3.5a1 1 0 0 0-1 1V10a1 1 0 0 0 1 1H5"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="5.75"/><path d="M8 4.75V8l2.25 1.5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 3.5 4.5 4.5L6 12.5"/></symbol>
  <symbol id="i-terminal" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="m4.5 6.5 2 1.75-2 1.75M8.5 10.5h3"/></symbol>
  <symbol id="i-plug" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5.5 2v3M10.5 2v3M4 5h8v3a4 4 0 0 1-8 0zM8 12v2.5"/></symbol>
  <symbol id="logo" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="3.2" rx="1.6" fill="#18266A"/><rect x="2" y="15.8" width="20" height="3.2" rx="1.6" fill="#2B5BF5"/><path d="M12 8.2v7.6" stroke="#2B5BF5" stroke-width="2.4" stroke-linecap="round"/></symbol>
</svg>
<a class="skip" href="#main">Skip to content</a>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Console">
    <div class="rail-head">
      <a class="logo" href="/console/" data-link><svg class="logo-mark" aria-hidden="true"><use href="#logo"/></svg>OrderTruth</a>
      <button class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="rail-body"><svg class="ic" aria-hidden="true"><use href="#i-menu"/></svg><span class="vh">Menu</span></button>
    </div>
    <div class="rail-body" id="rail-body">
      <div class="scope" id="scope"></div>
      <nav class="nav" aria-label="Primary">
        <a href="/console/" data-link data-nav="overview"><svg class="ic" aria-hidden="true"><use href="#i-home"/></svg>Overview</a>
        <a href="/console/incidents" data-link data-nav="incidents"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>Incidents<span class="count" id="open-count" hidden></span></a>
        <a href="/console/checkouts" data-link data-nav="checkouts"><svg class="ic" aria-hidden="true"><use href="#i-list"/></svg>Checkouts</a>
        <a href="/console/recovery" data-link data-nav="recovery"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg>Recovery</a>
      </nav>
      <ul class="health" id="health" aria-label="Connections"></ul>
    </div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="search" id="search">
        <label class="vh" for="search-input">Search incidents and checkouts</label>
        <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" placeholder="Search items, orders, captures, IDs" role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list">
        <kbd aria-hidden="true">/</kbd>
        <ul class="results" id="search-results" role="listbox" aria-label="Search results" hidden></ul>
      </div>
      <div class="top-r">
        <span class="checked" id="checked" aria-live="polite"></span>
        <button class="btn sec sm" id="refresh"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg>Refresh</button>
        <span class="env" title="This console only reads. Changes go through the repair command line."><span class="dot"></span>Local · read-only</span>
      </div>
    </header>
    <main class="page" id="main" tabindex="-1"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./main.ts"></script>
</body>
</html>
